<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glance</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="panel">
      <!-- Header: title and actions. Capture-mode and extraction-method
           controls land in MVP 4 and MVP 5. -->
      <header id="panel-header">
        <h1 id="panel-title">Glance</h1>
        <div class="header-actions">
          <button id="copy" type="button" class="link-button" hidden>Copy</button>
          <button id="download" type="button" class="link-button" hidden>
            Download
          </button>
          <button id="summarize" type="button" class="link-button">
            Summarize
          </button>
          <button id="open-settings" type="button" class="link-button">
            Settings
          </button>
        </div>
      </header>

      <!-- Body: skeleton while loading, then the section cards, or an error
           with a reason. Exactly one group is visible at a time. -->
      <main id="panel-body">
        <div id="skeleton" hidden aria-hidden="true">
          <div class="sk-line"></div>
          <div class="sk-line"></div>
          <div class="sk-line short"></div>
          <div class="sk-line"></div>
          <div class="sk-line short"></div>
        </div>

        <div id="cards" hidden></div>

        <div id="error" class="error" role="alert" hidden>
          <p id="error-message"></p>
          <p id="error-code" class="muted"></p>
          <button id="error-action" type="button" hidden></button>
        </div>
      </main>

      <!-- Footer: the follow-up question input arrives in MVP 6. -->
      <footer id="panel-footer">
        <input
          id="followup-input"
          type="text"
          placeholder="Ask a follow-up (coming soon)"
          disabled
        />
      </footer>
    </div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
